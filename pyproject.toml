[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-ecosystem"
version = "0.1.0"
description = "A small, testable foundation for WhatsApp automation services."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Oratile Masilo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whatsapp-ecosystem = "whatsapp_ecosystem:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["whatsapp_ecosystem"]
